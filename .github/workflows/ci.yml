name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  characterization:
    name: Characterization suite (v0.1.0 reference)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
